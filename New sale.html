<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sales System — All-in-One</title>
  <style>
    :root{
      --bg1:#0f2027; --bg2:#203a43; --bg3:#2c5364;
      --panel:#1a1f29; --card:#242b38;
      --accent:#06b6d4; --accent2:#7c3aed;
      --radius:12px; --muted:#94a3b8;
      font-family: Inter, ui-sans-serif, system-ui;
      color-scheme: dark;
    }
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;display:flex;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:#e6eef8;}
    .app{flex:1;display:flex;}
    .sidebar{width:240px;background:var(--panel);padding:20px;display:flex;flex-direction:column;}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
    .logo h1{font-size:1.1em;margin:0;}
    .nav-item{padding:10px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:10px;}
    .nav-item:hover,.nav-item.active{background:var(--accent);color:#fff;}
    .main{flex:1;padding:20px;overflow:auto;}
    .card{background:var(--card);padding:20px;border-radius:var(--radius);margin-bottom:20px;box-shadow:0 4px 8px rgba(0,0,0,0.2);}
    .table{width:100%;border-collapse:collapse;}
    .table th,.table td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.1);text-align:left;}
    .responsive-list{display:none;}
    .responsive-card{background:var(--card);padding:15px;margin:10px 0;border-radius:var(--radius);}
    .btn{padding:6px 12px;border:none;border-radius:var(--radius);cursor:pointer;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-danger{background:#ef4444;color:#fff;}
    .btn-secondary{background:#64748b;color:#fff;}

    /* Receipt Modal */
    #receiptModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:9999;}
    #receiptModal .modal-box{background:#fff;color:#000;padding:20px;width:400px;max-height:80%;overflow:auto;border-radius:var(--radius);}

    /* Add/Edit Sale Modal */
    #saleModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:9999;}
    #saleModal .modal-box{background:#fff;color:#000;padding:20px;width:400px;border-radius:var(--radius);}
    #saleModal input{width:100%;padding:8px;margin:5px 0;}

    @media(max-width:768px){
      .sidebar{width:70px;padding:10px;}
      .sidebar .logo h1,.sidebar .nav-item div{display:none;}
      .responsive-list{display:block;}
      .table{display:none;}
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo"><div class="mark">📊</div><h1>SALES SYSTEM</h1></div>
      <nav id="navList">
        <div class="nav-item active" data-view="dashboard">🏠 Dashboard</div>
        <div class="nav-item" data-view="sales">🧾 Sales</div>
        <div class="nav-item" data-view="inventory">📦 Inventory</div>
        <div class="nav-item" data-view="employees">👥 Employees</div>
        <div class="nav-item" data-view="suppliers">🚚 Suppliers</div>
        <div class="nav-item" data-view="expenses">💸 Expenses</div>
        <div class="nav-item" data-view="deposits">🏦 Deposits</div>
        <div class="nav-item" data-view="settings">⚙️ Settings</div>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <section data-view="dashboard" class="view card">
        <h2>Dashboard</h2>
        <p class="small-muted">Welcome to your Sales System overview.</p>
      </section>

      <section data-view="sales" class="view card" style="display:none">
        <h2>Sales <button class="btn btn-primary" onclick="openSaleModal()">+ Add Sale</button></h2>
        <table class="table" id="salesTable">
          <thead><tr><th>Date</th><th>Product</th><th>Customer</th><th>Qty</th><th>Total</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="responsive-list" id="salesList"></div>
      </section>

      <section data-view="inventory" class="view card" style="display:none"><h2>Inventory</h2></section>
      <section data-view="employees" class="view card" style="display:none"><h2>Employees</h2></section>
      <section data-view="suppliers" class="view card" style="display:none"><h2>Suppliers</h2></section>
      <section data-view="expenses" class="view card" style="display:none"><h2>Expenses</h2></section>
      <section data-view="deposits" class="view card" style="display:none"><h2>Deposits</h2></section>
      <section data-view="settings" class="view card" style="display:none"><h2>Settings</h2></section>
    </main>
  </div>

  <!-- Receipt Modal -->
  <div id="receiptModal"><div class="modal-box">
    <h2 style="text-align:center">Sales Receipt</h2>
    <div id="receiptContent"></div>
    <div style="text-align:center;margin-top:15px;">
      <button class="btn btn-primary" onclick="printReceipt()">🖨️ Print</button>
      <button class="btn btn-secondary" onclick="closeReceipt()">❌ Close</button>
    </div>
  </div></div>

  <!-- Add/Edit Sale Modal -->
  <div id="saleModal"><div class="modal-box">
    <h2 id="saleModalTitle">Add Sale</h2>
    <form id="saleForm">
      <input type="hidden" id="saleId" />
      <label>Product</label><input id="productName" required />
      <label>Customer</label><input id="customerName" />
      <label>Quantity</label><input id="quantity" type="number" required />
      <label>Price</label><input id="price" type="number" required />
      <div style="margin-top:10px;text-align:right;">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="btn btn-secondary" onclick="closeSaleModal()">Cancel</button>
      </div>
    </form>
  </div></div>

  <script>
    /* ==== Utilities ==== */
    const idf=()=>Math.random().toString(36).substr(2,9);
    const escapeHtml=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
    const formatUGX=n=>"UGX "+Number(n).toLocaleString();

    /* ==== Data ==== */
    const STORAGE_KEY="sales_data_v1";
    function loadData(){return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}
    function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
    let state=loadData();
    if(!state.sales){state={sales:[{id:idf(),date:Date.now(),productName:"Sample Product",customer:"John Doe",qty:2,price:50000,total:100000}]};saveData();}

    /* ==== Navigation ==== */
    document.querySelectorAll("#navList .nav-item").forEach(nav=>{
      nav.addEventListener("click",()=>{
        document.querySelectorAll("#navList .nav-item").forEach(n=>n.classList.remove("active"));
        nav.classList.add("active");
        const v=nav.dataset.view;
        document.querySelectorAll(".view").forEach(sec=>sec.style.display="none");
        document.querySelector(`.view[data-view='${v}']`).style.display="block";
      });
    });

    /* ==== Sales Rendering ==== */
    function renderSales(){
      const tbody=document.querySelector("#salesTable tbody"); tbody.innerHTML="";
      const list=document.getElementById("salesList"); list.innerHTML="";
      state.sales.forEach(s=>{
        const tr=document.createElement("tr");
        tr.innerHTML=`<td>${new Date(s.date).toLocaleString()}</td><td>${escapeHtml(s.productName)}</td><td>${escapeHtml(s.customer)}</td><td>${s.qty}</td><td>${formatUGX(s.total)}</td><td><button class='btn btn-secondary' onclick='openReceiptModal(${JSON.stringify(s)})'>Print</button></td>`;
        tbody.appendChild(tr);
        const card=document.createElement("div"); card.className="responsive-card";
        card.innerHTML=`<strong>${escapeHtml(s.productName)}</strong> - ${formatUGX(s.total)}<br><button class='btn btn-secondary' onclick='openReceiptModal(${JSON.stringify(s)})'>Print</button>`;
        list.appendChild(card);
      });
    }

    /* ==== Receipt ==== */
    function openReceiptModal(sale){
      const m=document.getElementById("receiptModal");
      const c=document.getElementById("receiptContent");
      c.innerHTML=`<p>Date: ${new Date(sale.date).toLocaleString()}</p><p>Customer: ${sale.customer}</p><p>Product: ${sale.productName}</p><p>Quantity: ${sale.qty}</p><p>Price: ${formatUGX(sale.price)}</p><p>Total: ${formatUGX(sale.total)}</p>`;
      m.style.display="flex";
    }
    function closeReceipt(){document.getElementById("receiptModal").style.display="none";}
    function printReceipt(){
      const html=document.getElementById("receiptContent").innerHTML;
      const w=window.open("","","width=600,height=400");
      w.document.write("<html><head><title>Print</title></head><body>"+html+"</body></html>");
      w.document.close(); w.print();
    }

    /* ==== Add/Edit Sale ==== */
    function openSaleModal(sale){
      document.getElementById("saleModal").style.display="flex";
      if(sale){
        document.getElementById("saleModalTitle").innerText="Edit Sale";
        document.getElementById("saleId").value=sale.id;
        document.getElementById("productName").value=sale.productName;
        document.getElementById("customerName").value=sale.customer;
        document.getElementById("quantity").value=sale.qty;
        document.getElementById("price").value=sale.price;
      } else {
        document.getElementById("saleForm").reset();
        document.getElementById("saleId").value="";
        document.getElementById("saleModalTitle").innerText="Add Sale";
      }
    }
    function closeSaleModal(){document.getElementById("saleModal").style.display="none";}
    document.getElementById("saleForm").onsubmit=function(e){
      e.preventDefault();
      const id=document.getElementById("saleId").value;
      const s={
        id:id||idf(),
        date:Date.now(),
        productName:document.getElementById("productName").value,
        customer:document.getElementById("customerName").value,
        qty:+document.getElementById("quantity").value,
        price:+document.getElementById("price").value,
      };
      s.total=s.qty*s.price;
      if(id){
        const idx=state.sales.findIndex(x=>x.id==id);
        state.sales[idx]=s;
      } else {state.sales.push(s);}
      saveData(); closeSaleModal(); renderSales();
    }

    /* ==== Init ==== */
    renderSales();
  </script>
</body>
</html>
