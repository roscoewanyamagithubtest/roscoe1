<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales System</title>
  <style>
    /* General Styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('2.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }

    header {
      position: relative;
      padding: 20px;
    }

    /* Globe-style logo */
    .logo-container {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #ADFF2F 60%, #FF0000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: blink 2s infinite;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .logo-text {
      font-size: 12px;
      color: white;
      text-align: center;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Navigation */
    nav {
      background-color: #444;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    nav button {
      background-color: #dc3545;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
    }
    nav button a {
      color: #fff;
      text-decoration: none;
    }

    /* Main container */
    main {
      margin: 40px auto;
      max-width: 1000px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    /* Form Rows */
    .form-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .form-group {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
    }
    label {
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="date"], input[type="text"], input[type="number"], textarea {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    textarea {
      height: 100px;
      resize: vertical;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }

    /* Items Section */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #f2f2f2;
    }

    /* Footer */
    footer {
      text-align: center;
      margin: 30px 0 10px;
      color: #fff;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-container">
      <div class="logo-text">SALES<br>SYSTEM</div>
    </div>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="New sale.html">NEW SALE</a>
    <a href="home.html">MAKE DEPOSIT</a>
    <a href="invoice.html">INVOICE</a>
    <a href="Expenses.html">EXPENSES</a>
    <a href="Records.html">Daily Records</a>
    <button><a href="Log In.html">Log Out</a></button>
  </nav>

  <!-- Main Content -->
  <main>
    <h2>NEW SALE</h2>

    <!-- Customer Info -->
    <section>
      <h3>Customer Information</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="cust-name">Customer Name:</label>
          <input type="text" id="cust-name" placeholder="Enter full name">
        </div>
        <div class="form-group">
          <label for="cust-contact">Contact:</label>
          <input type="text" id="cust-contact" placeholder="Phone / Email">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="cust-address">Address:</label>
          <input type="text" id="cust-address" placeholder="Enter address">
        </div>
      </div>
    </section>

    <!-- Date Range -->
    <section>
      <h3>Date Range</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="from-date">From:</label>
          <input type="date" id="from-date" name="from-date">
        </div>
        <div class="form-group">
          <label for="to-date">To:</label>
          <input type="date" id="to-date" name="to-date">
        </div>
        <div class="form-group">
          <button onclick="search()">Search</button>
        </div>
      </div>
    </section>

    <!-- Items -->
    <section>
      <h3>Items</h3>
      <table id="items-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Description</th>
            <th>Price (UGX)</th>
            <th>Quantity</th>
            <th>Subtotal (UGX)</th>
          </tr>
        </thead>
        <tbody id="items-body">
          <tr class="item">
            <td>1</td>
            <td><input type="text" class="description" required></td>
            <td><input type="number" class="price" required></td>
            <td><input type="number" class="quantity" value="1" required></td>
            <td><input type="text" class="subtotal" value="0.00" readonly></td>
          </tr>
        </tbody>
      </table>

      <button id="add-item">Add Item</button>
      <h2>Total: <span id="total">0</span> UGX</h2>
      <button id="process-sale">Process Sale</button>
      <button id="print-receipt" style="display:none;">Print Receipt</button>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2025 My Shop | Sales System Demo
  </footer>

  <!-- Scripts -->
  <script>
    function search() {
      const fromDate = document.getElementById("from-date").value;
      const toDate = document.getElementById("to-date").value;

      if (!fromDate || !toDate) {
        alert("Please select both From and To dates.");
        return;
      }
      if (fromDate > toDate) {
        alert("From date cannot be after To date.");
        return;
      }
      alert(`Date Range:\nFrom: ${fromDate}\nTo: ${toDate}`);
    }

    let total = 0;
    function updateSubtotal(row) {
      const price = parseFloat(row.querySelector('.price').value) || 0;
      const quantity = parseInt(row.querySelector('.quantity').value) || 0;
      const subtotal = price * quantity;
      row.querySelector('.subtotal').value = subtotal.toFixed(2);
      return subtotal;
    }
    function updateTotal() {
      total = 0;
      document.querySelectorAll('#items-body .item').forEach(row => {
        total += updateSubtotal(row);
      });
      document.getElementById('total').innerText = total.toFixed(2);
    }

    document.getElementById('add-item').addEventListener('click', function () {
      const rowCount = document.querySelectorAll('#items-body .item').length + 1;
      const newRow = document.createElement('tr');
      newRow.classList.add('item');
      newRow.innerHTML = `
        <td>${rowCount}</td>
        <td><input type="text" class="description" required></td>
        <td><input type="number" class="price" required></td>
        <td><input type="number" class="quantity" value="1" required></td>
        <td><input type="text" class="subtotal" value="0.00" readonly></td>
      `;
      document.getElementById('items-body').appendChild(newRow);

      newRow.querySelector('.price').addEventListener('input', updateTotal);
      newRow.querySelector('.quantity').addEventListener('input', updateTotal);
      updateTotal();
    });

    document.getElementById('items-body').addEventListener('input', function (event) {
      if (event.target.classList.contains('price') || event.target.classList.contains('quantity')) {
        updateTotal();
      }
    });

    document.getElementById('process-sale').addEventListener('click', function () {
      alert('Sale processed! Total: ' + total.toFixed(2) + ' UGX');
      document.getElementById('print-receipt').style.display = 'inline-block';
    });

    document.getElementById('print-receipt').addEventListener('click', function () {
      const custName = document.getElementById('cust-name').value || 'N/A';
      const custContact = document.getElementById('cust-contact').value || 'N/A';
      const custAddress = document.getElementById('cust-address').value || 'N/A';

      const rows = document.querySelectorAll('#items-body .item');
      let receiptHTML = `
        <h2 style="text-align:center;">Receipt</h2>
        <p><strong>Customer Name:</strong> ${custName}</p>
        <p><strong>Contact:</strong> ${custContact}</p>
        <p><strong>Address:</strong> ${custAddress}</p>
        <table border="1" cellspacing="0" cellpadding="6" width="100%" style="border-collapse:collapse;font-family:Arial,sans-serif;">
          <thead>
            <tr style="background:#f2f2f2;">
              <th>#</th>
              <th>Description</th>
              <th>Price (UGX)</th>
              <th>Quantity</th>
              <th>Subtotal (UGX)</th>
            </tr>
          </thead>
          <tbody>
      `;
      rows.forEach((row, index) => {
        const description = row.querySelector('.description').value || 'No Description';
        const price = parseFloat(row.querySelector('.price').value).toFixed(2);
        const quantity = parseInt(row.querySelector('.quantity').value);
        const subtotal = parseFloat(row.querySelector('.subtotal').value).toFixed(2);
        receiptHTML += `
          <tr>
            <td>${index + 1}</td>
            <td>${description}</td>
            <td>${price}</td>
            <td>${quantity}</td>
            <td>${subtotal}</td>
          </tr>
        `;
      });
      receiptHTML += `
          </tbody>
          <tfoot>
            <tr>
              <td colspan="4" style="text-align:right;font-weight:bold;">TOTAL:</td>
              <td style="font-weight:bold;">${total.toFixed(2)} UGX</td>
            </tr>
          </tfoot>
        </table>
        <p style="text-align:center;margin-top:20px;">Thank you for your purchase!</p>
      `;

      const printWindow = window.open('', '', 'height=600,width=600');
      printWindow.document.write(receiptHTML);
      printWindow.document.close();
      printWindow.print();
    });
  </script>
</body>
</html>
