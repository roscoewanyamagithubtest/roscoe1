<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales System</title>
<style>
  /* Reset & Base */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: url('2.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #333;
    font-size: 18px;
    line-height: 1.6;
  }

  header {
    position: relative;
    padding: 20px;
  }

  /* Globe-style Logo */
  .logo-container {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #ADFF2F 60%, #FF0000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: blink 2s infinite;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }

  .logo-text {
    font-size: 13px;
    color: white;
    text-align: center;
    font-weight: bold;
    text-shadow: 1px 1px 2px #000;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Navigation */
  nav {
    background-color: #222;
    padding: 12px 10px;
    text-align: center;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }

  nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 1rem;
    padding: 8px 12px;
    transition: background 0.3s ease;
  }

  nav a:hover {
    background: #444;
    border-radius: 5px;
  }

  nav button {
    background-color: #dc3545;
    border: none;
    padding: 10px 16px;
    border-radius: 5px;
    cursor: pointer;
  }

  nav button a {
    color: #fff;
    text-decoration: none;
    font-size: 1rem;
  }

  /* Main Container */
  main {
    margin: 40px auto;
    max-width: 1000px;
    background: rgba(255, 255, 255, 0.97);
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
  }

  h2, h3 {
    margin-top: 0;
    font-size: 1.5rem;
    color: #222;
  }

  /* Forms */
  .form-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .form-group {
    flex: 1;
    min-width: 250px;
    display: flex;
    flex-direction: column;
  }

  label {
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 1rem;
  }

  input[type="text"],
  input[type="date"],
  input[type="number"],
  textarea {
    padding: 12px;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    background-color: #fafafa;
  }

  textarea {
    resize: vertical;
    height: 100px;
  }

  button {
    padding: 12px 20px;
    background-color: #007bff;
    border: none;
    color: white;
    font-size: 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  button:hover {
    background-color: #0056b3;
  }

  /* Items Table */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    border-radius: 8px;
    overflow: hidden;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 12px 10px;
    text-align: center;
    font-size: 1rem;
  }

  th {
    background: #f8f8f8;
    font-weight: bold;
  }

  input.subtotal {
    background-color: #eee;
    cursor: not-allowed;
  }

  #add-item {
    margin-top: 15px;
    background-color: #28a745;
  }

  #add-item:hover {
    background-color: #1e7e34;
  }

  #process-sale {
    background-color: #ffc107;
    color: #000;
  }

  #process-sale:hover {
    background-color: #e0a800;
  }

  #print-receipt {
    background-color: #6c757d;
    margin-left: 10px;
  }

  #print-receipt:hover {
    background-color: #5a6268;
  }

  /* Footer */
  footer {
    text-align: center;
    margin: 30px 10px 20px;
    color: #fff;
    font-size: 16px;
  }

  /* Responsive Styling */
  @media (max-width: 768px) {
    body {
      font-size: 16px;
    }

    nav {
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    main {
      margin: 15px;
      padding: 20px;
    }

    h2, h3 {
      font-size: 1.3rem;
    }

    .form-row {
      flex-direction: column;
    }

    .form-group {
      min-width: 100%;
    }

    input, textarea, button {
      font-size: 1rem;
    }

    /* Mobile-friendly table */
    table, thead, tbody, th, td, tr {
      display: block;
    }

    table {
      border: none;
    }

    thead {
      display: none;
    }

    tr {
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
    }

    td {
      border: none;
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }

    td::before {
      content: attr(data-label);
      font-weight: bold;
      flex-basis: 40%;
      text-align: left;
    }
  }
</style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-container">
      <div class="logo-text">SALES<br>SYSTEM</div>
    </div>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="New sale.html">NEW SALE</a>
    <a href="home.html">MAKE DEPOSIT</a>
    <a href="invoice.html">INVOICE</a>
    <a href="Expenses.html">EXPENSES</a>
    <a href="Records.html">Daily Records</a>
    <button><a href="Log In.html">Log Out</a></button>
  </nav>

  <!-- Main Content -->
  <main>
    <h2>NEW SALE</h2>

    <!-- Customer Info -->
    <section>
      <h3>Customer Information</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="cust-name">Customer Name:</label>
          <input type="text" id="cust-name" placeholder="Enter full name">
        </div>
        <div class="form-group">
          <label for="cust-contact">Contact:</label>
          <input type="text" id="cust-contact" placeholder="Phone / Email">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="cust-address">Address:</label>
          <input type="text" id="cust-address" placeholder="Enter address">
        </div>
      </div>
    </section>

    <!-- Date Range -->
    <section>
      <h3>Date Range</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="from-date">From:</label>
          <input type="date" id="from-date" name="from-date">
        </div>
        <div class="form-group">
          <label for="to-date">To:</label>
          <input type="date" id="to-date" name="to-date">
        </div>
        <div class="form-group">
          <button onclick="search()">Search</button>
        </div>
      </div>
    </section>

    <!-- Items -->
    <section>
      <h3>Items</h3>
      <table id="items-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Description</th>
            <th>Price (UGX)</th>
            <th>Quantity</th>
            <th>Subtotal (UGX)</th>
          </tr>
        </thead>
        <tbody id="items-body">
          <tr class="item">
            <td data-label="#">1</td>
            <td data-label="Description"><input type="text" class="description" required></td>
            <td data-label="Price (UGX)"><input type="number" class="price" required></td>
            <td data-label="Quantity"><input type="number" class="quantity" value="1" required></td>
            <td data-label="Subtotal (UGX)"><input type="text" class="subtotal" value="0.00" readonly></td>
          </tr>
        </tbody>
      </table>

      <button id="add-item">Add Item</button>
      <h2>Total: <span id="total">0</span> UGX</h2>
      <button id="process-sale">Process Sale</button>
      <button id="print-receipt" style="display:none;">Print Receipt</button>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2025 My Shop | Sales System Demo
  </footer>

  <!-- Scripts -->
  <script>
    function search() {
      const fromDate = document.getElementById("from-date").value;
      const toDate = document.getElementById("to-date").value;

      if (!fromDate || !toDate) {
        alert("Please select both From and To dates.");
        return;
      }
      if (fromDate > toDate) {
        alert("From date cannot be after To date.");
        return;
      }
      alert(`Date Range:\nFrom: ${fromDate}\nTo: ${toDate}`);
    }

    let total = 0;
    function updateSubtotal(row) {
      const price = parseFloat(row.querySelector('.price').value) || 0;
      const quantity = parseInt(row.querySelector('.quantity').value) || 0;
      const subtotal = price * quantity;
      row.querySelector('.subtotal').value = subtotal.toFixed(2);
      return subtotal;
    }
    function updateTotal() {
      total = 0;
      document.querySelectorAll('#items-body .item').forEach(row => {
        total += updateSubtotal(row);
      });
      document.getElementById('total').innerText = total.toFixed(2);
    }

    document.getElementById('add-item').addEventListener('click', function () {
      const rowCount = document.querySelectorAll('#items-body .item').length + 1;
      const newRow = document.createElement('tr');
      newRow.classList.add('item');
      newRow.innerHTML = `
        <td data-label="#">${rowCount}</td>
        <td data-label="Description"><input type="text" class="description" required></td>
        <td data-label="Price (UGX)"><input type="number" class="price" required></td>
        <td data-label="Quantity"><input type="number" class="quantity" value="1" required></td>
        <td data-label="Subtotal (UGX)"><input type="text" class="subtotal" value="0.00" readonly></td>
      `;
      document.getElementById('items-body').appendChild(newRow);

      newRow.querySelector('.price').addEventListener('input', updateTotal);
      newRow.querySelector('.quantity').addEventListener('input', updateTotal);
      updateTotal();
    });

    document.getElementById('items-body').addEventListener('input', function (event) {
      if (event.target.classList.contains('price') || event.target.classList.contains('quantity')) {
        updateTotal();
      }
    });

    document.getElementById('process-sale').addEventListener('click', function () {
      alert('Sale processed! Total: ' + total.toFixed(2) + ' UGX');
      document.getElementById('print-receipt').style.display = 'inline-block';
    });

    document.getElementById('print-receipt').addEventListener('click', function () {
      const custName = document.getElementById('cust-name').value || 'N/A';
      const custContact = document.getElementById('cust-contact').value || 'N/A';
      const custAddress = document.getElementById('cust-address').value || 'N/A';

      const rows = document.querySelectorAll('#items-body .item');
      let receiptHTML = `
        <h2 style="text-align:center;">Receipt</h2>
        <p><strong>Customer Name:</strong> ${custName}</p>
        <p><strong>Contact:</strong> ${custContact}</p>
        <p><strong>Address:</strong> ${custAddress}</p>
        <table border="1" cellspacing="0" cellpadding="6" width="100%" style="border-collapse:collapse;font-family:Arial,sans-serif;">
          <thead>
            <tr style="background:#f2f2f2;">
              <th>#</th>
              <th>Description</th>
              <th>Price (UGX)</th>
              <th>Quantity</th>
              <th>Subtotal (UGX)</th>
            </tr>
          </thead>
          <tbody>
      `;
      rows.forEach((row, index) => {
        const description = row.querySelector('.description').value || 'No Description';
        const price = parseFloat(row.querySelector('.price').value).toFixed(2);
        const quantity = parseInt(row.querySelector('.quantity').value);
        const subtotal = parseFloat(row.querySelector('.subtotal').value).toFixed(2);
        receiptHTML += `
          <tr>
            <td>${index + 1}</td>
            <td>${description}</td>
            <td>${price}</td>
            <td>${quantity}</td>
            <td>${subtotal}</td>
          </tr>
        `;
      });
      receiptHTML += `
          </tbody>
          <tfoot>
            <tr>
              <td colspan="4" style="text-align:right;font-weight:bold;">TOTAL:</td>
              <td style="font-weight:bold;">${total.toFixed(2)} UGX</td>
            </tr>
          </tfoot>
        </table>
        <p style="text-align:center;margin-top:20px;">Thank you for your purchase!</p>
      `;

      const printWindow = window.open('', '', 'height=600,width=600');
      printWindow.document.write(receiptHTML);
      printWindow.document.close();
      printWindow.print();
    });
  </script>
</body>
</html>
